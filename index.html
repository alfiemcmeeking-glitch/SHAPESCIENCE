<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>AM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Vina+Sans&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#000; --fg:#fff; --red:#ff1f1f; --dim:#666; --line:#fff;
  --mono:'Cutive Mono',monospace; --disp:'Vina Sans',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--mono);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:var(--mono);background:transparent;color:var(--fg);border:1px solid var(--line);
  padding:6px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;font-size:12px;transition:.12s}
button:hover{background:var(--red);border-color:var(--red);color:#000}
input,textarea,select{font-family:var(--mono);background:#000;color:var(--fg);border:1px solid var(--line);
  padding:7px 9px;font-size:13px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--red)}
textarea{resize:vertical;min-height:64px}
a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--dim)}
a:hover{color:var(--red);border-color:var(--red)}
::placeholder{color:var(--dim)}
.disp{font-family:var(--disp);text-transform:uppercase;line-height:.9;letter-spacing:.01em}
.hl{color:var(--red)}
.muted{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}

/* ---------- LOCK SCREEN ---------- */
#lock{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;
  justify-content:center;z-index:100;gap:22px;padding:24px;text-align:center}
#lock h1{font-family:var(--disp);font-size:clamp(56px,13vw,150px);margin:0;text-transform:uppercase;line-height:.82}
#lock .sub{letter-spacing:.4em;font-size:12px;color:var(--dim);text-transform:uppercase}
#lock form{display:flex;gap:0;width:min(360px,90vw)}
#lock input{border-right:none;text-align:center;letter-spacing:.3em}
#lock button{white-space:nowrap}
#lockerr{color:var(--red);font-size:12px;min-height:16px;text-transform:uppercase;letter-spacing:.1em}

/* ---------- SHELL ---------- */
#app{display:none;flex-direction:column;height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header .brand{font-family:var(--disp);font-size:30px;text-transform:uppercase;line-height:.9}
header .date{font-size:11px;color:var(--dim);letter-spacing:.15em;text-transform:uppercase}
nav.toggle{display:flex;border:1px solid var(--line)}
nav.toggle button{border:none;border-right:1px solid var(--line);min-width:118px;font-size:13px;padding:9px 6px}
nav.toggle button:last-child{border-right:none}
nav.toggle button.active{background:var(--fg);color:#000}
nav.toggle button.active:hover{background:var(--red);color:#000}
.tools{display:flex;gap:6px}
.tools button{font-size:10px;padding:5px 8px}
main{flex:1;min-height:0;position:relative;overflow:hidden}
.page{display:none;height:100%;overflow:auto}
.page.active{display:block}
.pad{padding:18px}

/* ---------- NETWORK ---------- */
#net-wrap{display:flex;height:100%}
#net-left{flex:1;min-width:0;display:flex;flex-direction:column}
.net-toolbar{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.net-toolbar input{max-width:340px}
#graph{flex:1;min-height:0;position:relative}
#graph svg{width:100%;height:100%;display:block;cursor:grab}
#graph svg:active{cursor:grabbing}
.link{stroke:rgba(255,255,255,.16);stroke-width:1px}
.link.know{stroke:rgba(255,255,255,.62);stroke-width:1.5px}
.link.cat{stroke-width:1.1px;stroke-dasharray:3 4;opacity:.55}
.link.on{stroke:var(--red)!important;stroke-width:2.2px;opacity:1;stroke-dasharray:none}
.link.faded{opacity:.05}
.node circle{stroke:#000;stroke-width:1.4px;transition:stroke .12s,opacity .12s}
.node.me circle{stroke:var(--red);stroke-width:2.5px}
.node text{fill:var(--fg);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;
  pointer-events:none;text-anchor:middle}
.node:hover circle,.node.sel circle{stroke:var(--red);stroke-width:3px}
.node:hover text,.node.sel text{fill:var(--red)}
.node.match circle{stroke:var(--red);stroke-width:3px}
.node.match text{fill:var(--red)}
.node.dim{opacity:.12}
.node.li circle{stroke:rgba(255,255,255,.35)}
.node.li.off text{display:none}
/* category legend */
#legend{position:absolute;left:14px;bottom:14px;background:rgba(0,0,0,.85);border:1px solid var(--line);
  padding:11px 13px;width:215px;max-height:55%;overflow:auto;z-index:4}
#legend h4{margin:0 0 8px;font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.leg-item{display:flex;align-items:center;gap:8px;padding:3px 2px;cursor:pointer;font-size:11px;
  text-transform:uppercase;letter-spacing:.03em;line-height:1.2}
.leg-item:hover{color:var(--red)}
.leg-item.on{color:var(--red)}
.leg-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.3)}
.leg-count{margin-left:auto;color:var(--dim)}
/* linkedin toggle */
.li-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--dim);user-select:none}
.li-toggle .sw{width:34px;height:18px;border:1px solid var(--line);position:relative;display:inline-block;flex-shrink:0}
.li-toggle .sw::after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;background:var(--dim);transition:.15s}
.li-toggle.on{color:var(--fg)}
.li-toggle.on .sw{border-color:var(--red)}
.li-toggle.on .sw::after{left:17px;background:var(--red)}
#net-panel{width:330px;border-left:1px solid var(--line);overflow:auto;padding:18px;display:none;flex-shrink:0}
#net-panel.show{display:block}
#net-panel h2{font-family:var(--disp);font-size:32px;text-transform:uppercase;margin:0 0 4px;line-height:.9}
.field{margin:12px 0}
.field .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.15em;margin-bottom:3px}
.tag{display:inline-block;border:1px solid var(--line);padding:2px 7px;font-size:10px;text-transform:uppercase;
  letter-spacing:.08em;margin:3px 4px 0 0}
.tag:hover{border-color:var(--red);color:var(--red);cursor:pointer}
/* linkedin directory */
#li-dir h2{font-family:var(--disp);font-size:32px;text-transform:uppercase;margin:0 0 8px;line-height:.9}
#li-dir .meta{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;margin:8px 0}
#li-list{margin-top:6px}
.li-row{display:flex;align-items:center;gap:9px;padding:7px 2px;border-bottom:1px solid #222}
.li-row .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.3)}
.li-row .li-meta{flex:1;min-width:0}
.li-row .li-meta .nm{font-size:12px}
.li-row .li-meta .jb{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-row .pin{font-size:9px;padding:3px 6px;flex-shrink:0;border:1px solid var(--line)}
.li-row .pin.on{background:var(--red);border-color:var(--red);color:#000}
.li-row a.prof{font-size:11px;color:var(--dim);flex-shrink:0;border:none}
.li-row a.prof:hover{color:var(--red)}
.combo{position:relative}
.drop{position:absolute;left:0;right:0;top:100%;z-index:6;background:#000;border:1px solid var(--line);
  border-top:none;max-height:190px;overflow:auto;display:none}
.drop.show{display:block}
.drop .item{padding:8px 9px;font-size:13px;cursor:pointer;border-bottom:1px solid #222}
.drop .item:last-child{border-bottom:none}
.drop .item:hover{background:var(--red);color:#000}
.drop .item:hover .muted{color:#000}
.drop .item.new{color:var(--dim)}
.tokenbox{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line);padding:6px;min-height:40px;align-items:center;cursor:text}
.tokenbox input{border:none;flex:1;min-width:120px;padding:4px;width:auto;background:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:2px 4px 2px 7px;
  font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.chip .x{cursor:pointer;color:var(--dim);padding:0 3px}
.chip:hover{border-color:var(--red);color:var(--red)}
.chip:hover .x{color:var(--red)}

/* ---------- COMPETITIONS ---------- */
.banner{border:1px solid var(--line);padding:16px;margin:0 0 16px}
.banner .today{font-family:var(--disp);font-size:clamp(30px,5vw,52px);text-transform:uppercase;line-height:.85}
.banner .next{margin-top:10px;font-size:13px}
.banner .next b{color:var(--red)}
.alerts{margin-top:10px;font-size:12px}
.alerts .a{padding:3px 0;border-top:1px dotted var(--dim)}
.comp-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.comp-toolbar input{max-width:300px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.card:hover{border-color:var(--red)}
.card.done{opacity:.45}
.card .ttl{font-family:var(--disp);font-size:25px;text-transform:uppercase;line-height:.88;padding-right:34px}
.card .imp{position:absolute;top:12px;right:12px;font-size:11px;border:1px solid var(--line);
  padding:2px 6px;letter-spacing:.05em}
.card .imp.high{border-color:var(--red);color:var(--red)}
.badge{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);padding:2px 6px}
.badge.live{border-color:var(--red);color:var(--red)}
.card .meta{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.card .reqs{font-size:12px;line-height:1.45}
.card .deadline{font-size:12px}
.card .deadline.soon{color:var(--red)}
.card .acts{display:flex;gap:6px;margin-top:auto;align-items:center;flex-wrap:wrap}
.card .acts button{font-size:10px;padding:4px 7px}
.chk{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.chk input{width:auto}

/* ---------- DAILY ---------- */
.daily-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.daily-head .big{font-family:var(--disp);font-size:clamp(40px,7vw,84px);text-transform:uppercase;line-height:.82}
.daily-head .dow{color:var(--dim);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.viewtoggle{display:flex;border:1px solid var(--line)}
.viewtoggle button{border:none;border-right:1px solid var(--line);min-width:120px}
.viewtoggle button:last-child{border-right:none}
.viewtoggle button.active{background:var(--fg);color:#000}
.viewtoggle button.active:hover{background:var(--red);color:#000}
.prog{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.15em;margin:10px 0 14px}
.tasks{display:flex;flex-direction:column;gap:8px;max-width:760px}
.task{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:8px 10px;background:#000}
.task.dragging{opacity:.4}
.task.over{border-color:var(--red)}
.task .num{font-family:var(--disp);font-size:26px;width:34px;text-align:center;line-height:1;color:var(--dim)}
.task .handle{cursor:grab;color:var(--dim);font-size:16px;user-select:none;padding:0 2px}
.task .handle:hover{color:var(--red)}
.task input.time{width:74px;text-align:center}
.task input.txt{flex:1;border:none;background:transparent;padding:6px 2px}
.task input.txt:focus{border-bottom:1px solid var(--red)}
.task.done input.txt{color:var(--dim);text-decoration:line-through}
.task .carry{font-size:9px;color:var(--red);border:1px solid var(--red);padding:1px 4px;text-transform:uppercase;letter-spacing:.08em}
.task .del{cursor:pointer;color:var(--dim);font-size:15px;padding:0 4px}
.task .del:hover{color:var(--red)}
.task .box{width:18px;height:18px;border:1px solid var(--line);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.task .box.on{background:var(--red);border-color:var(--red)}
.task .box.on::after{content:"x";color:#000;font-size:13px;line-height:1}
.daily-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:flex-start;
  justify-content:center;z-index:90;overflow:auto;padding:40px 16px}
.modal.show{display:flex}
.modal .box{border:1px solid var(--line);background:#000;width:min(620px,100%);padding:22px}
.modal h2{font-family:var(--disp);font-size:34px;text-transform:uppercase;margin:0 0 16px;line-height:.9}
.modal label{display:block;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.15em;margin:12px 0 4px}
.modal .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .foot{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
select[multiple]{height:120px}

/* competitions — team, stages, ticker */
.ticker{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:#000;white-space:nowrap;position:relative}
.ticker-track{display:inline-flex;align-items:stretch;animation:tick 45s linear infinite;will-change:transform}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-seg{display:inline-flex;align-items:center;padding:8px 20px;font-size:13px;font-weight:bold;
  text-transform:uppercase;letter-spacing:.06em;color:#000;white-space:nowrap;border-right:3px solid #000}
.seg-alfie{background:#00e5ff}
.seg-greg{background:#ff2ec4}
.seg-alina{background:#eaff00}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.dleft{font-family:var(--disp);font-size:32px;line-height:.8;text-transform:uppercase}
.dleft.soon{color:var(--red)}
.dleft.tbc{font-size:15px;color:var(--dim);font-family:var(--mono)}
.who{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.wchip{border:1px solid var(--line);color:var(--dim);padding:3px 9px;font-size:10px;text-transform:uppercase;
  letter-spacing:.06em;cursor:pointer;user-select:none;transition:.1s}
.wchip:hover{border-color:#fff;color:#fff}
.wchip.on{color:#000;border-color:transparent;font-weight:bold}
.wchip.w-alfie.on{background:#00e5ff}
.wchip.w-greg.on{background:#ff2ec4}
.wchip.w-alina.on{background:#eaff00}
.stage-sel{font-size:11px;padding:5px 6px;text-transform:uppercase;letter-spacing:.04em;width:auto}
.stage-badge{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);padding:2px 6px}
.stage-badge.won{border-color:#3ad07a;color:#3ad07a}
.stage-badge.lost{border-color:var(--dim);color:var(--dim)}
.stage-badge.prog{border-color:#f5b301;color:#f5b301}
.stage-badge.sub{border-color:#4ea1ff;color:#4ea1ff}
@media(max-width:760px){
  html,body{-webkit-text-size-adjust:100%}
  header{padding:10px 12px;gap:8px}
  header .brand{font-size:22px}
  header .date{font-size:10px}
  nav.toggle{width:100%;order:3}
  nav.toggle button{min-width:0;flex:1;padding:11px 4px;font-size:12px}
  .tools{order:2}
  .tools button{padding:6px 9px}
  /* network */
  #net-wrap{flex-direction:column;height:auto}
  #net-left{flex:none}
  .net-toolbar{padding:10px 12px;gap:8px}
  .net-toolbar input{max-width:none;flex:1 1 100%;order:-1}
  .net-toolbar button,.net-toolbar .li-toggle{flex:0 0 auto}
  #graph{height:60vh;min-height:360px;flex:none}
  #legend{width:148px;padding:8px 9px;max-height:44%;left:8px;bottom:8px}
  #legend h4{font-size:9px;margin-bottom:5px}
  .leg-item{font-size:10px;gap:6px;padding:2px}
  .leg-dot{width:9px;height:9px}
  .li-toggle{font-size:10px}
  #net-panel{width:auto;border-left:none;border-top:1px solid var(--line);flex:none}
  #net-panel h2{font-size:26px}
  /* competitions */
  .pad{padding:12px}
  .banner{padding:12px}
  .banner .today{font-size:24px}
  .ticker-seg{font-size:11px;padding:7px 14px}
  .dleft{font-size:26px}
  .grid{grid-template-columns:1fr;gap:12px}
  .card .ttl{font-size:21px}
  .comp-toolbar>*{flex:1 1 100%;max-width:none}
  /* daily */
  .daily-head{gap:10px}
  .daily-head .big{font-size:38px}
  .viewtoggle{width:100%}
  .viewtoggle button{flex:1;min-width:0;padding:9px 4px}
  .tasks{max-width:none}
  .task{gap:7px;padding:7px 8px}
  .task .num{font-size:19px;width:24px}
  .task .handle{display:none}
  .task input.time{width:58px}
  /* modal */
  .modal{padding:14px 8px;align-items:flex-start}
  .modal .box{padding:16px;width:100%}
  .modal h2{font-size:26px}
  .modal .two{grid-template-columns:1fr}
  select[multiple]{height:150px}
  .drop{max-height:150px}
}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lock">
  <div class="sub">private</div>
  <h1>Alfie<br>McMeeking</h1>
  <form id="lockform" autocomplete="off">
    <input id="pw" type="password" placeholder="PASSWORD" autocomplete="off" autofocus>
    <button type="submit">Enter</button>
  </form>
  <div id="lockerr"></div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div>
      <div class="brand">A·M</div>
      <div class="date" id="hdr-date"></div>
    </div>
    <nav class="toggle">
      <button data-page="net" class="active">Network</button>
      <button data-page="comp">Competitions</button>
      <button data-page="daily">Daily</button>
    </nav>
    <div class="tools">
      <span id="sync" class="muted" style="font-size:10px;align-self:center;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap"></span>
      <button id="btn-export">Export</button>
      <button id="btn-import">Import</button>
      <button id="btn-lock">Lock</button>
    </div>
  </header>

  <main>
    <!-- NETWORK -->
    <section class="page active" id="page-net">
      <div id="net-wrap">
        <div id="net-left">
          <div class="net-toolbar">
            <input id="net-search" placeholder="SEARCH BY NAME OR WHAT THEY DO">
            <button id="net-add">+ Add connection</button>
            <button id="net-clear" style="display:none">Clear</button>
            <button id="li-list-btn">🔗 LinkedIn list</button>
            <div class="li-toggle" id="li-toggle"><span class="sw"></span><span id="li-label">LinkedIn hidden</span></div>
            <span class="muted" id="net-count"></span>
          </div>
          <div id="graph"><div id="legend"></div></div>
        </div>
        <aside id="net-panel"></aside>
      </div>
    </section>

    <!-- COMPETITIONS -->
    <section class="page" id="page-comp">
      <div class="ticker" id="comp-ticker"></div>
      <div class="pad">
        <div class="banner" id="comp-banner"></div>
        <div class="comp-toolbar">
          <input id="comp-search" placeholder="SEARCH COMPETITIONS">
          <select id="comp-sort" style="width:auto">
            <option value="deadline">Sort: deadline</option>
            <option value="importance">Sort: importance</option>
            <option value="name">Sort: name</option>
          </select>
          <select id="comp-filter" style="width:auto">
            <option value="todo">Show: to-do</option>
            <option value="all">Show: all</option>
            <option value="done">Show: complete</option>
          </select>
          <select id="comp-person" style="width:auto">
            <option value="all">Who: everyone</option>
            <option value="Alfie">Who: Alfie</option>
            <option value="Greg">Who: Greg</option>
            <option value="Alina">Who: Alina</option>
            <option value="none">Who: unassigned</option>
          </select>
          <button id="comp-add">+ Add competition</button>
        </div>
        <div class="grid" id="comp-grid"></div>
      </div>
    </section>

    <!-- DAILY -->
    <section class="page" id="page-daily">
      <div class="pad">
        <div class="daily-head">
          <div>
            <div class="dow" id="daily-dow"></div>
            <div class="big" id="daily-date"></div>
          </div>
          <div class="viewtoggle">
            <button data-view="today" class="active">Today</button>
            <button data-view="tomorrow">Tomorrow (write ahead)</button>
          </div>
        </div>
        <div class="prog" id="daily-prog"></div>
        <div class="tasks" id="daily-list"></div>
        <div class="daily-actions">
          <button id="daily-addtask">+ Add task</button>
          <button id="daily-sorttime">Sort by time</button>
        </div>

const BOARD_ID = "main";

let sb=null, cloudReady=false, _lastRemote=0, _pushT=null;
function cloudEnabled(){return !!(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase);}
function setSync(t){const e=document.getElementById('sync');if(e)e.textContent=t;}
if(cloudEnabled()){try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);}catch(e){console.error(e);}}
function currentState(){return {network:CONTACTS,comps:COMPS,tasks:TASKS,linkedin:{v:LI_VERSION,list:LINKEDIN}};}
function hydrate(state){
  if(!state)return;
  localStorage.setItem('am_comps_team_v1','1');            // cloud is authoritative — never auto-assign over it
  if(state.network){CONTACTS=state.network;localStorage.setItem(K.net,JSON.stringify(CONTACTS));}
  if(state.comps){COMPS=state.comps;localStorage.setItem(K.comp,JSON.stringify(COMPS));normComps();}
  if(state.tasks){TASKS=state.tasks;localStorage.setItem(K.task,JSON.stringify(TASKS));}
  if(state.linkedin&&Array.isArray(state.linkedin.list)){LINKEDIN=state.linkedin.list;localStorage.setItem('am_linkedin',JSON.stringify(state.linkedin));}
  if(appReady){try{buildGraph();}catch(e){}try{renderComps();}catch(e){}try{renderDaily();}catch(e){}_tickerSig='';buildTicker();}
}
function schedulePush(){if(!cloudEnabled())return;clearTimeout(_pushT);_pushT=setTimeout(pushCloud,800);}
async function pushCloud(initial){
  if(!cloudEnabled())return;
  if(!cloudReady&&!initial)return;                          // don't overwrite cloud before we've loaded it
  setSync('saving…');
  try{
    const {error}=await sb.from('board').upsert({id:BOARD_ID,data:currentState(),client:CLIENT_ID,updated_at:new Date().toISOString()});
    if(error)throw error;
    _lastRemote=Date.now();
    setSync('☁ synced');
  }catch(e){console.error('pushCloud',e);setSync('save failed — kept locally');}
}
async function cloudLoad(){
  if(!cloudEnabled()){setSync('local only');return;}
  setSync('connecting…');
  try{
    const {data,error}=await sb.from('board').select('data,updated_at').eq('id',BOARD_ID).maybeSingle();
    if(error)throw error;
    if(data&&data.data){_lastRemote=new Date(data.updated_at).getTime();hydrate(data.data);setSync('☁ synced');}
    else{cloudReady=true;await pushCloud(true);}         // first run — seed the cloud from this device
    cloudReady=true;
    subscribeRealtime();
  }catch(e){console.error('cloudLoad',e);setSync('offline — local only');}
}
function subscribeRealtime(){
  if(!cloudEnabled())return;
  sb.channel('board-'+BOARD_ID)
    .on('postgres_changes',{event:'*',schema:'public',table:'board',filter:'id=eq.'+BOARD_ID},payload=>{
      const row=payload.new;if(!row||row.client===CLIENT_ID)return;   // ignore our own writes
      const t=new Date(row.updated_at).getTime();if(t<=_lastRemote)return;
      _lastRemote=t;hydrate(row.data);setSync('☁ updated');setTimeout(()=>setSync('☁ synced'),1500);
    }).subscribe();
}

    COMPS.filter(c=>!isDone(c)&&c.due&&c.due>=today).sort((a,b)=>a.due.localeCompare(b.due))

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function slug(s){return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function todayKey(){const d=new Date();return d.toISOString().slice(0,10);}
function dateAdd(key,n){const d=new Date(key+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function fmtLong(key){const d=new Date(key+'T00:00:00');return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function dow(key){return new Date(key+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long'});}
function daysUntil(iso){if(!iso)return null;const a=new Date(todayKey()+'T00:00:00'),b=new Date(iso+'T00:00:00');return Math.round((b-a)/864e5);}

    if(d.network){CONTACTS=d.network;save(K.net,CONTACTS);buildGraph();}

}

const LI_VERSION = 4;
let _li = load('am_linkedin', null);
let LINKEDIN = (_li && _li.v===LI_VERSION && Array.isArray(_li.list)) ? _li.list : SEED_LINKEDIN.map(x=>({...x}));
function saveLI(){ save('am_linkedin', {v:LI_VERSION, list:LINKEDIN}); }
saveLI();
function liOnMap(){ return LINKEDIN.filter(l=>l.onMap); }

let G={nodes:[],links:[]}, sim=null, selId=null, activeCat=null, liOn=false;

function buildGraph(){
  const nodes=[{id:'alfie',name:'Alfie',me:true,job:'Me',category:'Me'}];
  CONTACTS.forEach(c=>nodes.push({...c,src:'curated'}));
  liOnMap().forEach(l=>nodes.push({...l,src:'linkedin'}));
  const ids=new Set(nodes.map(n=>n.id));
  const seen=new Set(), links=[];
  function addLink(a,b,type,color){if(a===b||!ids.has(a)||!ids.has(b))return;
    const key=[a,b].sort().join('|');if(seen.has(key))return;seen.add(key);
    links.push({source:a,target:b,type,color});}
  // hub spokes (faint white) from Alfie to everyone
  CONTACTS.forEach(c=>addLink('alfie',c.id,'hub'));
  liOnMap().forEach(l=>addLink('alfie',l.id,'hub'));
  // KNOW lines (solid white) — people who actually know each other
  CONTACTS.forEach(c=>(c.conn||[]).forEach(t=>addLink(c.id,t,'know')));
  // CATEGORY lines (coloured dashes) — same industry / field
  const byCat={};
  CONTACTS.forEach(c=>{if(!c.category)return;(byCat[c.category]=byCat[c.category]||[]).push(c.id);});
  Object.entries(byCat).forEach(([cat,arr])=>{
    if(arr.length<2)return;const col=catColor(cat);
    const n=arr.length;
    for(let i=0;i<n;i++){if(n===2&&i===1)break;addLink(arr[i],arr[(i+1)%n],'cat',col);}
  });
  G={nodes,links};
  drawGraph();
  $('#net-count').textContent=CONTACTS.length+' connections';
  renderLegend();
}
function nodeFill(d){if(d.me)return '#fff';
  if(d.src==='linkedin')return liOn?catColor(d.category):'#3a3a3a';
  return catColor(d.category);}
function nodeR(d){if(d.me)return 13;if(d.src==='linkedin')return liOn?6:4;return 7;}
let _graphRAF=null,_graphTries=0,_lastGraphW=0;
function drawGraph(){
  const el=$('#graph');
  if(_graphRAF){cancelAnimationFrame(_graphRAF);_graphRAF=null;}
  if(!el)return;
  const W=el.clientWidth, H=el.clientHeight||(el.parentElement&&el.parentElement.clientHeight)||440;
  if(!W){                                   // container not laid out yet
    if($('#page-net').classList.contains('active') && _graphTries<60){
      _graphTries++; _graphRAF=requestAnimationFrame(drawGraph);   // BOUNDED retry — never an infinite loop
    }
    return;
  }
  _graphTries=0; _lastGraphW=W;
  if(typeof d3==='undefined'){
    if(!el.querySelector('#dwarn'))el.insertAdjacentHTML('beforeend',
      '<div id="dwarn" style="position:absolute;top:14px;left:14px;color:var(--red);font-size:12px">Map library still loading — give it a second and switch tabs back.</div>');
    return;
  }
  if(sim){sim.stop();sim=null;}             // kill any running simulation before rebuilding
  const dw=el.querySelector('#dwarn');if(dw)dw.remove();
  const ex=el.querySelector('svg');if(ex)ex.remove();           // keep #legend, drop old svg
  const svg=d3.select(el).append('svg').attr('viewBox',[0,0,W,H]);
  const g=svg.append('g');
  svg.call(d3.zoom().scaleExtent([.2,4]).on('zoom',ev=>g.attr('transform',ev.transform)));
  const link=g.selectAll('.link').data(G.links).join('line')
    .attr('class',d=>'link '+d.type).attr('stroke',d=>d.color||null);
  const node=g.selectAll('.node').data(G.nodes,d=>d.id).join('g')
    .attr('class',d=>'node'+(d.me?' me':'')+(d.src==='linkedin'?' li'+(liOn?'':' off'):''))
    .call(d3.drag()
      .on('start',(ev,d)=>{if(!ev.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag',(ev,d)=>{d.fx=ev.x;d.fy=ev.y;})
      .on('end',(ev,d)=>{if(!ev.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));
  node.append('circle').attr('r',nodeR).attr('fill',nodeFill);
  node.append('text').attr('dy',d=>d.me?-19:-12).text(d=>d.name);
  node.on('click',(ev,d)=>{ev.stopPropagation();selectNode(d.id);});
  svg.on('click',()=>{selId=null;activeCat=null;$('#net-panel').classList.remove('show');renderLegend();applyVisual();});
  sim=d3.forceSimulation(G.nodes)
    .force('link',d3.forceLink(G.links).id(d=>d.id)
      .distance(d=>d.type==='know'?70:d.type==='cat'?95:(d.target.src==='linkedin'||d.source.src==='linkedin'?190:130))
      .strength(d=>d.type==='cat'?.18:.5))
    .force('charge',d3.forceManyBody().strength(-260))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('collide',d3.forceCollide(34))
    .on('tick',()=>{
      link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      node.attr('transform',d=>`translate(${d.x},${d.y})`);
    });
  G._link=link;G._node=node;
  applyLinkedIn();applyVisual();
}
function neighbours(id){const s=new Set([id]);G.links.forEach(l=>{const a=l.source.id||l.source,b=l.target.id||l.target;
  if(a===id)s.add(b);if(b===id)s.add(a);});return s;}
function inCat(d){return activeCat&&(activeCat==='__li'?d.src==='linkedin':d.category===activeCat);}
function applyVisual(){
  if(!G._node)return;
  const q=$('#net-search').value.trim().toLowerCase();
  const hay=d=>[d.name,d.job,d.expertise,d.category,d.met,d.contact].join(' ').toLowerCase();
  const nb=selId?neighbours(selId):null;
  G._node.each(function(d){
    const sel=selId&&d.id===selId;
    const dimNb=nb&&!nb.has(d.id);
    const searchMiss=q&&!d.me&&!hay(d).includes(q);
    const catMiss=activeCat&&!d.me&&!inCat(d);
    const match=(q&&!d.me&&hay(d).includes(q))||(activeCat&&inCat(d));
    d3.select(this).classed('sel',sel).classed('dim',dimNb||searchMiss||catMiss).classed('match',match&&!sel);
  });
  G._link.classed('on',l=>{if(!selId)return false;const a=l.source.id||l.source,b=l.target.id||l.target;return a===selId||b===selId;});
  $('#net-clear').style.display=(q||activeCat)?'inline-block':'none';
}
function applyLinkedIn(){
  if(!G._node)return;
  $('#li-toggle').classList.toggle('on',liOn);
  $('#li-label').textContent=liOn?'LinkedIn shown':'LinkedIn hidden';
  G._node.filter(d=>d.src==='linkedin').classed('off',!liOn)
    .select('circle').attr('r',nodeR).attr('fill',nodeFill);
  G._link.classed('faded',l=>!liOn&&((l.source.src==='linkedin')||(l.target.src==='linkedin')));
}
function renderLegend(){
  const counts={};CONTACTS.forEach(c=>{const k=c.category||'Uncategorised';counts[k]=(counts[k]||0)+1;});
  const cats=Object.keys(counts).sort();
  let html='<h4>Categories</h4>';
  html+=`<div class="leg-item${activeCat==='Me'?' on':''}" data-cat="Me"><span class="leg-dot" style="background:#fff"></span>⭐ Me</div>`;
  cats.forEach(k=>{html+=`<div class="leg-item${activeCat===k?' on':''}" data-cat="${esc(k)}">`+
    `<span class="leg-dot" style="background:${catColor(k)}"></span>${catEmoji(k)} ${esc(k)}`+
    `<span class="leg-count">${counts[k]}</span></div>`;});
  if(LINKEDIN.length)html+=`<div class="leg-item${activeCat==='__li'?' on':''}" data-cat="__li">`+
    `<span class="leg-dot" style="background:#7a7a7a"></span>🔗 LinkedIn<span class="leg-count">${liOnMap().length}/${LINKEDIN.length}</span></div>`;
  $('#legend').innerHTML=html;
  $$('#legend .leg-item').forEach(it=>it.addEventListener('click',()=>{
    activeCat=(activeCat===it.dataset.cat?null:it.dataset.cat);renderLegend();applyVisual();}));
}
function selectNode(id){
  selId=id;applyVisual();
  if(id==='alfie'){$('#net-panel').classList.remove('show');return;}
  const c=CONTACTS.find(x=>x.id===id);if(!c)return;
  const conns=(c.conn||[]).map(t=>{const o=CONTACTS.find(x=>x.id===t);return o?o:null;}).filter(Boolean);
  const incoming=CONTACTS.filter(x=>(x.conn||[]).includes(id));
  const allConn=[...new Map([...conns,...incoming].map(o=>[o.id,o])).values()];
  const isLink=v=>/^https?:/.test(v);
  const contactHtml=(c.contact||'').split(',').map(s=>s.trim()).filter(Boolean)
    .map(s=>isLink(s)?`<a href="${esc(s)}" target="_blank">${esc(s.replace(/^https?:\/\/(www\.)?/,'').slice(0,34))}</a>`:esc(s)).join('<br>')||'<span class="muted">—</span>';
  $('#net-panel').classList.add('show');
  $('#net-panel').innerHTML=`
    <h2>${esc(c.name)}</h2>
    <div class="tag" style="border-color:${catColor(c.category)}"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${catColor(c.category)};margin-right:5px;vertical-align:middle"></span>${catEmoji(c.category)} ${esc(c.category||'')}</div>
    <div class="field"><div class="k">Who they are</div>${esc(c.job||'—')}</div>
    <div class="field"><div class="k">What they do</div>${esc(c.expertise||'—')}</div>
    <div class="field"><div class="k">Contact</div>${contactHtml}</div>
    <div class="field"><div class="k">How I met them</div>${esc(c.met||'—')}</div>
    <div class="field"><div class="k">Connected to</div>${allConn.length?allConn.map(o=>`<span class="tag" data-go="${o.id}">${esc(o.name)}</span>`).join(''):'<span class="muted">—</span>'}</div>
    <div class="row" style="margin-top:14px">
      <button data-edit="${c.id}">Edit</button>
      <button data-del="${c.id}">Delete</button>
    </div>`;
  $$('#net-panel .tag[data-go]').forEach(t=>t.addEventListener('click',()=>selectNode(t.dataset.go)));
  $('#net-panel [data-edit]').addEventListener('click',()=>contactForm(c));
  $('#net-panel [data-del]').addEventListener('click',()=>{
    if(confirm('Delete '+c.name+'?')){CONTACTS=CONTACTS.filter(x=>x.id!==c.id);
      CONTACTS.forEach(x=>x.conn=(x.conn||[]).filter(t=>t!==c.id));
      save(K.net,CONTACTS);selId=null;$('#net-panel').classList.remove('show');buildGraph();}
  });
}

function contactForm(c){
  const cats=[...new Set(CONTACTS.map(x=>x.category).filter(Boolean))].sort();

  openModal(`

  /* category combobox — pick an existing one or type a brand-new category */

      html+=`<div class="item new" data-v="${esc(typed)}">+ Add new category "${esc(typed)}"</div>`;

  }
  catInput.addEventListener('focus',renderCat);

  catDrop.addEventListener('mousedown',e=>{const it=e.target.closest('.item');if(!it)return;

  /* connected-to token picker — type to search names, click to add a chip */

      box.insertBefore(chip,connInput);});
  }
  function renderConnDrop(){
    const q=connInput.value.trim().toLowerCase();

      [o.name,o.job,o.category,o.expertise].join(' ').toLowerCase().includes(q)).slice(0,10);

  connInput.addEventListener('focus',renderConnDrop);
  connInput.addEventListener('input',renderConnDrop);
  connInput.addEventListener('blur',()=>setTimeout(()=>connDrop.classList.remove('show'),150));
  connInput.addEventListener('keydown',e=>{
    if(e.key==='Backspace'&&!connInput.value&&selected.length){selected.pop();renderChips();}});
  connDrop.addEventListener('mousedown',e=>{const it=e.target.closest('.item');if(!it)return;
    e.preventDefault();selected.push(it.dataset.id);connInput.value='';renderChips();renderConnDrop();connInput.focus();});
  box.addEventListener('mousedown',e=>{const x=e.target.closest('.x');if(!x)return;
    e.preventDefault();selected=selected.filter(id=>id!==x.dataset.id);renderChips();});
  renderChips();

  $('#f-save').addEventListener('click',()=>{
    const name=$('#f-name').value.trim();if(!name){alert('Name required');return;}
    const data={name,job:$('#f-job').value.trim(),category:$('#f-cat').value.trim(),
      expertise:$('#f-exp').value.trim(),contact:$('#f-contact').value.trim(),met:$('#f-met').value.trim(),conn:selected.slice()};
    if(c){Object.assign(c,data);}
    else{let id=slug(name);while(CONTACTS.some(x=>x.id===id))id+='-1';CONTACTS.push({id,...data});}
    save(K.net,CONTACTS);closeModal();buildGraph();
    if(c)selectNode(c.id);
  });
}

/* ====================================================================
   COMPETITIONS
==================================================================== */
function renderComps(){
  renderBanner();
  const q=$('#comp-search').value.trim().toLowerCase();
  const sort=$('#comp-sort').value, filt=$('#comp-filter').value, person=$('#comp-person').value;
  let list=COMPS.slice();
  if(filt==='todo')list=list.filter(c=>!isHidden(c));
  else if(filt==='done')list=list.filter(c=>isDone(c));
  if(person==='none')list=list.filter(c=>!(c.who&&c.who.length));
  else if(person!=='all')list=list.filter(c=>(c.who||[]).includes(person));
  if(q)list=list.filter(c=>[c.comp,c.category,c.desc,c.reqs,c.notes].join(' ').toLowerCase().includes(q));
  list.sort((a,b)=>{
    const ad=isDone(a)?1:0, bd=isDone(b)?1:0; if(ad!==bd)return ad-bd;  // parked/finished sink to the bottom
    if(sort==='importance')return b.importance-a.importance;
    if(sort==='name')return a.comp.localeCompare(b.comp);
    const da=a.due||'9999',db=b.due||'9999';return da.localeCompare(db);
  });
  const SC={'Won':'won',"Didn't win":'lost','Not entering':'lost','In progress':'prog','Submitted':'sub'};
  $('#comp-grid').innerHTML=list.map(c=>{
    const dleft=daysUntil(c.due);
    const soon=dleft!=null&&dleft>=0&&dleft<=14&&!isDone(c);
    const dl=dleft==null?'DATE TBC':(dleft<0?`${-dleft}D AGO`:dleft===0?'TODAY':`${dleft} DAYS`);
    const live=/OPEN NOW|URGENT/i.test(c.status);
    return `<div class="card${isDone(c)?' done':''}">
      <div class="imp${c.importance>=8?' high':''}">${c.importance}/10</div>
      <div class="ttl">${esc(c.comp)}</div>
      <div class="row" style="gap:10px;align-items:flex-end">
        <div class="dleft${soon?' soon':''}${dleft==null?' tbc':''}">${dl}</div>
        <span class="badge${live?' live':''}">${esc(c.status||'—')}</span>
        ${c.stage&&c.stage!=='Not started'?`<span class="stage-badge ${SC[c.stage]||''}">${esc(c.stage)}</span>`:''}
      </div>
      <div class="meta">${esc(c.category)} · effort ${esc(c.effort||'?')} · ${esc(c.cost||'')}${c.accel&&c.accel!=='No'?' · accelerator':''}</div>
      <div class="deadline${soon?' soon':''}">Deadline: ${esc(c.deadline||'—')}</div>
      <div class="reqs">${esc(c.reqs||'')}</div>
      <div class="meta">Prize: ${esc(c.prize||'—')}</div>
      ${c.notes?`<div class="meta" style="text-transform:none">${esc(c.notes)}</div>`:''}
      <div class="who">${TEAM.map(p=>`<span class="wchip w-${p.toLowerCase()}${(c.who||[]).includes(p)?' on':''}" data-who="${c.id}|${p}">${p}</span>`).join('')}</div>
      <div class="acts">
        <select class="stage-sel" data-stage="${c.id}">${STAGES.map(s=>`<option${c.stage===s?' selected':''}>${s}</option>`).join('')}</select>
        ${c.doc?`<a href="${esc(c.doc)}" target="_blank"><button>📄 Doc</button></a>`:''}
        ${c.link?`<a href="${esc(c.link)}" target="_blank"><button>Open ↗</button></a>`:''}
        <button data-edit="${c.id}">Edit</button>
      </div>
    </div>`;
  }).join('')|| '<span class="muted">No competitions match.</span>';
  const hidden=(filt==='todo')?COMPS.filter(isHidden).length:0;
  if(hidden){$('#comp-grid').insertAdjacentHTML('afterbegin',
    `<div style="grid-column:1/-1" class="muted">${hidden} finished ${hidden===1?'entry is':'entries are'} hidden here — <a href="#" id="show-all-comp">show all</a> to view or change them.</div>`);
    const sa=$('#show-all-comp');if(sa)sa.addEventListener('click',e=>{e.preventDefault();$('#comp-filter').value='all';renderComps();});}
  $$('#comp-grid [data-edit]').forEach(b=>b.addEventListener('click',()=>compForm(COMPS.find(c=>c.id===b.dataset.edit))));
  $$('#comp-grid .stage-sel').forEach(sel=>sel.addEventListener('change',()=>{
    const c=COMPS.find(x=>x.id===sel.dataset.stage);if(!c)return;
    c.stage=sel.value;c.complete=(c.stage==="Won"||c.stage==="Didn't win");save(K.comp,COMPS);renderComps();}));
  $$('#comp-grid .wchip').forEach(ch=>ch.addEventListener('click',()=>{
    const [id,p]=ch.dataset.who.split('|');const c=COMPS.find(x=>x.id===id);if(!c)return;
    c.who=c.who||[];c.who=c.who.includes(p)?c.who.filter(x=>x!==p):[...c.who,p];
    save(K.comp,COMPS);renderComps();}));
  buildTicker();
}
let _tickerSig='';
function buildTicker(){
  const t=$('#comp-ticker');if(!t)return;
  const today=todayKey();const segs=[];
  TEAM.forEach(p=>{
    const items=COMPS.filter(c=>!isDone(c)&&c.stage!=='Submitted'&&(c.who||[]).includes(p)&&c.due&&c.due>=today)
      .sort((a,b)=>a.due.localeCompare(b.due));
    if(!items.length){segs.push({p,text:`BREAKING NEWS — ${p.toUpperCase()}: NO OPEN ENTRIES ASSIGNED`});}
    else items.forEach(c=>{const d=daysUntil(c.due);
      const when=d===0?'TODAY':`IN ${d} DAY${d===1?'':'S'}`;
      const req=(c.reqs||'').split(/[.;]/)[0].trim().slice(0,70);
      segs.push({p,text:`BREAKING NEWS — ${p.toUpperCase()} NEEDS TO ENTER ${c.comp.toUpperCase()} ${when}${req?' · '+req.toUpperCase():''}`});});
  });
  const sig=segs.map(s=>s.p+'|'+s.text).join('~~');
  if(sig===_tickerSig)return;                 // unchanged -> keep the animation running smoothly
  _tickerSig=sig;
  const one=segs.map(s=>`<span class="ticker-seg seg-${s.p.toLowerCase()}">${esc(s.text)}</span>`).join('');
  t.innerHTML=`<div class="ticker-track">${one}${one}</div>`;
  const track=t.querySelector('.ticker-track');
  requestAnimationFrame(()=>{const w=track.scrollWidth/2;if(w>0)track.style.animationDuration=Math.max(24,Math.round(w/80))+'s';});
}
function renderBanner(){
  const today=todayKey();
  const up=COMPS.filter(c=>!isDone(c)&&c.stage!=='Submitted'&&c.due&&c.due>=today).sort((a,b)=>a.due.localeCompare(b.due));
  const next=up[0];
  const alerts=COMPS.filter(c=>!isDone(c)&&((c.due&&daysUntil(c.due)!=null&&daysUntil(c.due)>=0&&daysUntil(c.due)<=21)||/OPEN NOW|URGENT/i.test(c.status)))
    .sort((a,b)=>((a.due||'9999').localeCompare(b.due||'9999')));
  let html=`<div class="today">Today is ${fmtLong(today).replace(/,/g,'')}</div>`;
  if(next){const dl=daysUntil(next.due);
    html+=`<div class="next"><b>Next to enter:</b> ${esc(next.comp)} — ${esc(next.deadline)} <b>(${dl===0?'TODAY':dl+' days'})</b><br>
      <span class="muted" style="text-transform:none">Required:</span> ${esc(next.reqs)}</div>`;
  }else{html+=`<div class="next muted">No dated open competitions ahead — check the VERIFY-deadline ones below.</div>`;}
  if(alerts.length){
    html+=`<div class="alerts"><div class="muted" style="letter-spacing:.15em;margin-bottom:4px">ALERTS — OPEN / CLOSING SOON</div>`;
    alerts.slice(0,8).forEach(c=>{const d=daysUntil(c.due);
      html+=`<div class="a"><b class="hl">${esc(c.comp)}</b> — ${esc(c.status)}${c.due&&d>=0?` · ${d===0?'TODAY':d+'d left'}`:''} · ${esc(c.deadline)}</div>`;});
    html+=`</div>`;
  }
  $('#comp-banner').innerHTML=html;
}
function compForm(c){
  const F=(id,v,t='text')=>`<input id="${id}" type="${t}" value="${v!=null?esc(v):''}">`;
  openModal(`
    <h2>${c?'Edit':'Add'} competition</h2>
    <label>Competition</label>${F('c-comp',c&&c.comp)}
    <div class="two">
      <div><label>Importance /10</label>${F('c-imp',c?c.importance:5,'number')}</div>
      <div><label>Category</label>${F('c-cat',c&&c.category)}</div>
    </div>
    <label>Description</label><textarea id="c-desc">${c?esc(c.desc):''}</textarea>
    <label>Link</label>${F('c-link',c&&c.link)}
    <div class="two">
      <div><label>Entry cost</label>${F('c-cost',c&&c.cost)}</div>
      <div><label>Prize (max cash)</label>${F('c-prize',c&&c.prize)}</div>
    </div>
    <label>Key requirements</label><textarea id="c-reqs">${c?esc(c.reqs):''}</textarea>
    <div class="two">
      <div><label>Deadline (text)</label>${F('c-deadline',c&&c.deadline)}</div>
      <div><label>Deadline date (for alerts)</label>${F('c-due',c&&c.due,'date')}</div>
    </div>
    <div class="two">
      <div><label>Status</label>${F('c-status',c&&c.status)}</div>
      <div><label>Effort to apply</label>${F('c-effort',c&&c.effort)}</div>
    </div>
    <div class="two">
      <div><label>Accelerator?</label>${F('c-accel',c&&c.accel)}</div>
      <div><label>Application stage</label>
        <select id="c-stage">${STAGES.map(s=>`<option${(c&&c.stage===s)?' selected':''}>${esc(s)}</option>`).join('')}</select></div>
    </div>
    <label>Team — who is entering? (click to toggle)</label>
    <div class="who" id="c-who">${TEAM.map(p=>`<span class="wchip w-${p.toLowerCase()}${(c&&(c.who||[]).includes(p))?' on':''}" data-p="${p}">${p}</span>`).join('')}</div>
    <label>Imperial SharePoint doc (link — opens in a new tab)</label>${F('c-doc',c&&c.doc)}
    <label>Notes / verify</label><textarea id="c-notes">${c?esc(c.notes):''}</textarea>
    <div class="foot">
      ${c?`<button id="c-del" style="margin-right:auto">Delete</button>`:''}
      <button onclick="closeModal()">Cancel</button><button id="c-save">Save</button>
    </div>`);
  $$('#c-who .wchip').forEach(ch=>ch.addEventListener('click',()=>ch.classList.toggle('on')));
  $('#c-save').addEventListener('click',()=>{
    const name=$('#c-comp').value.trim();if(!name){alert('Name required');return;}
    const stage=$('#c-stage').value;
    const who=[...document.querySelectorAll('#c-who .wchip.on')].map(x=>x.dataset.p);
    const data={comp:name,importance:+$('#c-imp').value||0,category:$('#c-cat').value.trim(),
      desc:$('#c-desc').value.trim(),link:$('#c-link').value.trim(),cost:$('#c-cost').value.trim(),
      prize:$('#c-prize').value.trim(),reqs:$('#c-reqs').value.trim(),deadline:$('#c-deadline').value.trim(),
      due:$('#c-due').value.trim(),status:$('#c-status').value.trim(),effort:$('#c-effort').value.trim(),
      accel:$('#c-accel').value.trim(),stage,who,doc:$('#c-doc').value.trim(),
      complete:(stage==="Won"||stage==="Didn't win"),notes:$('#c-notes').value.trim()};
    if(c){Object.assign(c,data);}else{COMPS.push({id:'c'+Date.now(),...data});}
    save(K.comp,COMPS);closeModal();renderComps();
  });
  if(c)$('#c-del').addEventListener('click',()=>{if(confirm('Delete '+c.comp+'?')){
    COMPS=COMPS.filter(x=>x.id!==c.id);save(K.comp,COMPS);closeModal();renderComps();}});
}
['#comp-search','#comp-sort','#comp-filter','#comp-person'].forEach(s=>$(s).addEventListener('input',renderComps));
$('#comp-add').addEventListener('click',()=>compForm(null));

/* ====================================================================
   DAILY
==================================================================== */
let dailyView='today';
function reconcile(){
  const today=todayKey();
  if(!TASKS[today])TASKS[today]=[];
  const exists=new Set(TASKS[today].map(t=>t.text.trim().toLowerCase()));
  Object.keys(TASKS).filter(k=>k<today).sort().forEach(k=>{
    const keep=[];
    TASKS[k].forEach(t=>{
      if(t.done){keep.push(t);}
      else{const key=t.text.trim().toLowerCase();
        if(t.text.trim()&&!exists.has(key)){TASKS[today].push({...t,done:false,carried:true});exists.add(key);}}
    });
    TASKS[k]=keep;
  });
  save(K.task,TASKS);
}
function curKey(){return dailyView==='today'?todayKey():dateAdd(todayKey(),1);}
function renderDaily(){
  reconcile();
  const key=curKey();
  if(!TASKS[key])TASKS[key]=[];
  $('#daily-dow').textContent=(dailyView==='today'?'Today · ':'Tomorrow · ')+dow(key);
  $('#daily-date').textContent=fmtLong(key).replace(/,/g,'');
  const list=TASKS[key];
  const done=list.filter(t=>t.done).length;
  $('#daily-prog').textContent=`${done} / ${list.length||0} done${list.length<10?'  ·  '+(10-list.length)+' slots left':''}`;
  const box=$('#daily-list');box.innerHTML='';
  list.forEach((t,i)=>{
    const row=document.createElement('div');
    row.className='task'+(t.done?' done':'');row.draggable=true;row.dataset.i=i;
    row.innerHTML=`
      <span class="handle">⋮⋮</span>
      <span class="num">${i+1}</span>
      <div class="box${t.done?' on':''}" data-toggle></div>
      <input class="time" placeholder="--:--" value="${esc(t.time||'')}" data-time>
      <input class="txt" placeholder="What needs doing" value="${esc(t.text||'')}" data-text>
      ${t.carried?'<span class="carry">carried</span>':''}
      <span class="del" data-del>✕</span>`;
    row.querySelector('[data-toggle]').addEventListener('click',()=>{t.done=!t.done;save(K.task,TASKS);renderDaily();});
    row.querySelector('[data-text]').addEventListener('change',e=>{t.text=e.target.value;t.carried=false;save(K.task,TASKS);});
    row.querySelector('[data-time]').addEventListener('change',e=>{t.time=e.target.value;save(K.task,TASKS);});
    row.querySelector('[data-del]').addEventListener('click',()=>{list.splice(i,1);save(K.task,TASKS);renderDaily();});
    row.addEventListener('dragstart',e=>{row.classList.add('dragging');e.dataTransfer.setData('i',i);});
    row.addEventListener('dragend',()=>row.classList.remove('dragging'));
    row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('over');});
    row.addEventListener('dragleave',()=>row.classList.remove('over'));
    row.addEventListener('drop',e=>{e.preventDefault();row.classList.remove('over');
      const from=+e.dataTransfer.getData('i'),to=i;if(from===to)return;
      const m=list.splice(from,1)[0];list.splice(to,0,m);save(K.task,TASKS);renderDaily();});
    box.appendChild(row);
  });
}
$$('.viewtoggle button').forEach(b=>b.addEventListener('click',()=>{
  $$('.viewtoggle button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  dailyView=b.dataset.view;renderDaily();}));
$('#daily-addtask').addEventListener('click',()=>{
  const key=curKey();if(!TASKS[key])TASKS[key]=[];
  if(TASKS[key].length>=20){alert('That is plenty for one day.');return;}
  TASKS[key].push({text:'',time:'',done:false});save(K.task,TASKS);renderDaily();
  const inputs=$$('#daily-list .txt');if(inputs.length)inputs[inputs.length-1].focus();
});
$('#daily-sorttime').addEventListener('click',()=>{
  const key=curKey();TASKS[key].sort((a,b)=>{
    const ta=a.time||'99:99',tb=b.time||'99:99';return ta.localeCompare(tb);});
  save(K.task,TASKS);renderDaily();
});

let _resizeT=null;
window.addEventListener('resize',()=>{
  if(!$('#page-net').classList.contains('active'))return;
  clearTimeout(_resizeT);
  _resizeT=setTimeout(()=>{
    const el=$('#graph');
    if(el && Math.abs(el.clientWidth-_lastGraphW)>40) drawGraph();
  },200);
});

/* Auto-unlock on reload — runs LAST, after every variable & function above is defined,
   and on the next frame so the layout is ready before the map draws. */
if(sessionStorage.getItem('am_auth')==='1'){
  requestAnimationFrame(()=>unlock());
}
